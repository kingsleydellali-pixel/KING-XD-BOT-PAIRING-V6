<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KING XD V6 — Pair with QR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

    :root {
      --gold: #d4af37;
      --darker: #050505;
      --card: #111;
      --border: #222;
      --green: #00ff88;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--darker);
      color: #ccc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.8em;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.8em;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 35px 25px;
    }

    .qr-box {
      background: #0a0a0a;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
    }

    .qr-box img {
      width: 250px;
      height: 250px;
      image-rendering: pixelated;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .steps {
      font-size: 0.85em;
      color: #777;
      line-height: 1.8;
      margin-top: 15px;
      text-align: left;
    }

    .steps strong { color: var(--gold); }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold), #b8960c);
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Cinzel', serif;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    button:hover {
      box-shadow: 0 0 30px rgba(212,175,55,0.4);
      transform: translateY(-2px);
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 0.85em;
      letter-spacing: 2px;
      transition: color 0.3s;
    }

    .back:hover { color: var(--gold); }

    .error {
      color: #ff4444;
      font-size: 0.85em;
      margin-top: 15px;
      display: none;
    }

    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 PAIR WITH QR</h1>
    <div class="subtitle">KING XD V6</div>

    <div class="card">
      <div class="qr-box" id="qrBox">
        <div class="loader" id="loader"></div>
      </div>

      <div class="error" id="error"></div>

      <div class="steps">
        <strong>1.</strong> Open WhatsApp on your phone<br>
        <strong>2.</strong> Go to Settings → Linked Devices<br>
        <strong>3.</strong> Tap "Link a Device"<br>
        <strong>4.</strong> Scan the QR code above<br>
        <strong>5.</strong> Your session ID will be sent to your WhatsApp inbox
      </div>

      <button onclick="refreshQR()">🔄 Refresh QR</button>
    </div>

    <a href="/main.html" class="back">← Back to Home</a>
  </div>

  <script src="qr1.js"></script>
</body>
</html>
