<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KING XD V6 — Pair with Code</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

    :root {
      --gold: #d4af37;
      --dark: #0a0a0a;
      --darker: #050505;
      --card: #111;
      --border: #222;
      --green: #00ff88;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--darker);
      color: #ccc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.8em;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.8em;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 35px 25px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85em;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--darker);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1em;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212,175,55,0.1);
    }

    input::placeholder { color: #333; }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold), #b8960c);
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Cinzel', serif;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      box-shadow: 0 0 30px rgba(212,175,55,0.4);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: var(--darker);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: none;
    }

    .result.show { display: block; }

    .code-display {
      font-family: 'Cinzel', serif;
      font-size: 2.2em;
      color: var(--gold);
      letter-spacing: 8px;
      text-align: center;
      margin: 15px 0;
      text-shadow: 0 0 20px rgba(212,175,55,0.5);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(212,175,55,0.5); }
      50% { text-shadow: 0 0 40px rgba(212,175,55,0.8), 0 0 60px rgba(212,175,55,0.3); }
    }

    .steps {
      font-size: 0.85em;
      color: #777;
      line-height: 1.8;
      margin-top: 15px;
    }

    .steps strong { color: var(--gold); }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 0.85em;
      letter-spacing: 2px;
      transition: color 0.3s;
    }

    .back:hover { color: var(--gold); }

    .loader {
      display: none;
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader.show { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      color: #ff4444;
      font-size: 0.85em;
      margin-top: 15px;
      display: none;
    }

    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 PAIR WITH CODE</h1>
    <div class="subtitle">KING XD V6</div>

    <div class="card">
      <label>WhatsApp Number (with country code)</label>
      <input type="tel" id="phone" placeholder="e.g. 233245529834" inputmode="numeric">

      <button id="pairBtn" onclick="requestPair()">Generate Pairing Code</button>

      <div class="loader" id="loader"></div>
      <div class="error" id="error"></div>

      <div class="result" id="result">
        <p style="color: #888; font-size: 0.85em; text-align: center;">Your Pairing Code</p>
        <div class="code-display" id="codeDisplay">--------</div>

        <div class="steps">
          <strong>1.</strong> Open WhatsApp on your phone<br>
          <strong>2.</strong> Go to Settings → Linked Devices<br>
          <strong>3.</strong> Tap "Link a Device" → "Link with phone number"<br>
          <strong>4.</strong> Enter the 8-digit code above<br>
          <strong>5.</strong> Your session ID will be sent to your WhatsApp inbox
        </div>
      </div>
    </div>

    <a href="/main.html" class="back">← Back to Home</a>
  </div>

  <script src="pair1.js"></script>
</body>
</html>
